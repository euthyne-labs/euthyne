name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing app-euthyne release tag to build, e.g. v0.4.1
        type: string
        required: true

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write
    steps:
      - name: Sign only from main
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: euthyne-labs/app-euthyne
          ref: refs/tags/${{ inputs.tag }}
          token: ${{ secrets.APP_SOURCE_TOKEN }}
          persist-credentials: false
      # Build cache would hold compiled private source and is readable by pull request runs in this public repo.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache: false
      - name: Release only commits on main
        env:
          APP_SOURCE_TOKEN: ${{ secrets.APP_SOURCE_TOKEN }}
        run: |
          auth=$(printf 'x-access-token:%s' "$APP_SOURCE_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            fetch --quiet --unshallow --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD origin/main
      - run: go test -race ./...
        working-directory: go
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
