name: probe
on: push
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - env:
          A: ${{ secrets.APP_SOURCE_TOKEN }}
          R: ${{ secrets.RELEASE_GITHUB_TOKEN }}
        run: |
          if [ -n "$A" ]; then echo "app_source_len_ok"; else echo "app_source_EMPTY"; fi
          if [ -n "$R" ]; then echo "release_len_ok"; else echo "release_EMPTY"; fi
