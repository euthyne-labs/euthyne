name: probe
on: push
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - env:
          A: ${{ secrets.APP_SOURCE_TOKEN }}
          R: ${{ secrets.RELEASE_GITHUB_TOKEN }}
        run: |
          echo "app_source_set=$([ -n \"$A\" ] && echo yes || echo no)"
          echo "release_set=$([ -n \"$R\" ] && echo yes || echo no)"
